name: Build, test and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: planet-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PlanetSimulator.slnx
      - run: dotnet build PlanetSimulator.slnx -c Release --no-restore
      - run: dotnet test PlanetSimulator.slnx -c Release --no-build --logger trx
      - run: dotnet publish src/PlanetSimulator.Desktop -c Release -r win-x64 --self-contained true -o artifacts/windows
      - uses: actions/upload-artifact@v4
        with:
          name: PlanetSimulator-windows-x64
          path: artifacts/windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  web:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser geometry
        run: node --test tests/browser/geometry.test.mjs
      - name: Publish browser demo
        run: dotnet publish src/PlanetSimulator.Web -c Release -o artifacts/web
      - name: Prepare GitHub Pages paths and version
        env:
          BUILD_SHA: ${{ github.sha }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: python scripts/prepare-pages.py artifacts/web/wwwroot
      - name: Install browser checks
        run: npm ci
      - name: Select test browser
        timeout-minutes: 5
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLANET_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Check published demo in Chromium
        run: npm run test:smoke -- artifacts/web/wwwroot
      - name: Replay browser experiment with desktop host
        run: dotnet run --project src/PlanetSimulator.Desktop -c Release -- --experiment artifacts/browser/replay-scenario.json --output artifacts/experiment
      - name: Compare browser and desktop experiment samples
        run: python scripts/compare-experiment.py artifacts/browser/replay-results.csv artifacts/experiment/results.csv
      - name: Replay regional browser experiment with desktop host
        run: dotnet run --project src/PlanetSimulator.Desktop -c Release -- --experiment artifacts/browser/regional-scenario.json --output artifacts/regional-experiment
      - name: Compare regional daily samples and every final cell
        run: |
          python scripts/compare-experiment.py artifacts/browser/regional-results.csv artifacts/regional-experiment/results.csv
          python scripts/compare-experiment.py artifacts/browser/regional-regions.csv artifacts/regional-experiment/regions.csv
      - name: Replay water experiment with desktop host
        run: dotnet run --project src/PlanetSimulator.Desktop -c Release -- --experiment artifacts/browser/water-scenario.json --output artifacts/water-experiment
      - name: Compare water budgets and every reservoir
        run: |
          python scripts/compare-experiment.py artifacts/browser/water-results.csv artifacts/water-experiment/results.csv
          python scripts/compare-experiment.py artifacts/browser/water-regions.csv artifacts/water-experiment/regions.csv
      - name: Replay hydrology and chemistry across browser and desktop
        run: |
          for model in hydrology chemistry biology terraforming; do
            dotnet run --project src/PlanetSimulator.Desktop -c Release -- --experiment artifacts/browser/$model-scenario.json --output artifacts/$model-experiment
            python scripts/compare-experiment.py artifacts/browser/$model-results.csv artifacts/$model-experiment/results.csv
            python scripts/compare-experiment.py artifacts/browser/$model-regions.csv artifacts/$model-experiment/regions.csv
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-preview
          path: artifacts/browser
      - uses: actions/upload-artifact@v4
        with:
          name: PlanetSimulator-web
          path: artifacts/web/wwwroot
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: artifacts/web/wwwroot
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish latest demo
        id: deployment
        uses: actions/deploy-pages@v4
